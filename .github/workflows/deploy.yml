name: Build & Deploy to IONOS SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🔨 Compilation du projet pour la production
        run: npm run build

      - name: 🚀 Déploiement SFTP automatique sur IONOS
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Si vous utilisez une clé privée SSH (format OpenSSH valide) au lieu du mot de passe :
          # ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          local_path: './dist/*'
          remote_path: './'
          sftp_only: true
